services:
  - type: web
    name: spendsense-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_AUTH_REQUIRED
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////tmp/spendsense.db
      - key: CORS_ORIGINS
        value: https://spendsense-web-2dqc.onrender.com
  - type: web
    runtime: static
    name: spendsense-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://spendsense-api-ajrv.onrender.com/api
      - key: VITE_PUBLIC_DEMO
        value: "true"
